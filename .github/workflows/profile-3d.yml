name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "59 23 * * *"
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Verify 3D SVG Generation
        run: |
          echo "=== profile-3d-contrib directory ==="
          ls -la profile-3d-contrib/ || echo "DIRECTORY NOT FOUND"
          echo "=== SVG file count ==="
          ls profile-3d-contrib/*.svg 2>/dev/null | wc -l
          echo "=== SVG hashes ==="
          md5sum profile-3d-contrib/*.svg
          echo "=== Comparing with committed versions ==="
          for f in profile-3d-contrib/*.svg; do
            committed_hash=$(git show HEAD:"$f" | md5sum | awk '{print $1}')
            current_hash=$(md5sum "$f" | awk '{print $1}')
            if [ "$committed_hash" = "$current_hash" ]; then
              echo "UNCHANGED: $f"
            else
              echo "CHANGED:   $f"
            fi
          done

      - name: Commit and Push SVGs
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/RiteshGenAI/RiteshGenAI.git
          git add profile-3d-contrib/
          git diff-index --cached --quiet HEAD && echo "No changes to commit" && exit 0
          git commit -m "chore: update 3D contribution graph SVGs"
          git push origin main
