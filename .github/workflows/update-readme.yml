name: Update Dynamic Repositories

# This workflow updates the README with dynamic content
# It runs daily at midnight UTC and on manual trigger

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - main
      - master

permissions:
  contents: write

# Apply to all jobs in the workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch and Update Repositories
        run: |
          python -c "
          import requests
          import re
          import time

          # Fetch public repositories for user RiteshGenAI
          url = 'https://api.github.com/users/RiteshGenAI/repos?sort=updated&per_page=50'
          response = requests.get(url)
          repos = response.json()

          if not isinstance(repos, list):
              print('Error fetching repos:', repos)
              exit(1)

          # Filter out the profile README repository itself and forks
          filtered = [r for r in repos if r['name'].lower() != 'riteshgenai' and not r['fork']]

          # Sort by stars first, then by most recently updated
          filtered.sort(key=lambda r: (r.get('stargazers_count', 0), r.get('updated_at', '')), reverse=True)

          # Take the top 4 repositories
          top_repos = filtered[:4]

          # Generate pin cards layout
          html = '<p align=\"center\">\n'
          for repo in top_repos:
              name = repo['name']
              html += f'  <a href=\"https://github.com/RiteshGenAI/{name}\">\n'
              html += f'    <img src=\"https://gh-readme-stats.vercel.app/api/pin/?username=RiteshGenAI&repo={name}&theme=calm\" height=\"120\" />\n'
              html += '  </a>\n'
          html += '</p>'

          # Generate streak element with cache-buster to avoid stale cache
          cache_bust = int(time.time())
          streak_html = (
              '<p align=\"center\">\n'
              f'  <img src=\"https://streak-stats.demolab.com/?user=RiteshGenAI&theme=calm&{cache_bust}\"'
              ' alt=\"GitHub Streak\" />\n'
              '</p>'
          )

          # Read current README.md
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # Replace both featured repos and streak stats
          pattern_repos = r'<!-- RECENT_REPOS_START -->.*?<!-- RECENT_REPOS_END -->'
          replacement_repos = f'<!-- RECENT_REPOS_START -->\\n{html}\\n<!-- RECENT_REPOS_END -->'
          new_content = re.sub(pattern_repos, replacement_repos, content, flags=re.DOTALL)

          pattern_streak = r'<!-- STREAK_START -->.*?<!-- STREAK_END -->'
          replacement_streak = f'<!-- STREAK_START -->\\n{streak_html}\\n<!-- STREAK_END -->'
          new_content = re.sub(pattern_streak, replacement_streak, new_content, flags=re.DOTALL)

          # Update GitHub stats and top-langs cards with cache-buster
          import time
          cache_bust = int(time.time())
          new_content = re.sub(
              r'(<img src="https://gh-readme-stats\.vercel\.app/api\?username=RiteshGenAI&show_icons=true&theme=calm&count_private=true")',
              f'\\1&{cache_bust}',
              new_content
          )
          new_content = re.sub(
              r'(<img src="https://gh-readme-stats\.vercel\.app/api/top-langs/\?username=RiteshGenAI&theme=calm&langs_count=10")',
              f'\\1&{cache_bust}',
              new_content
          )

          # Update GitHub data cards back to working external URLs
          pattern_cards = r'<!-- GITHUB_DATA_START -->.*?<!-- GITHUB_DATA_END -->'
          replacement_cards = (
              '<!-- GITHUB_DATA_START -->\n'
              '<p align="center">\n'
              '  <img src="https://github-profile-summary-cards.vercel.app/api/cards/stats?username=RiteshGenAI&theme=calm" height="200" />\n'
              '  <img src="https://github-profile-summary-cards.vercel.app/api/cards/productive-time?username=RiteshGenAI&theme=calm" height="200" />\n'
              '</p>\n'
              '<p align="center">\n'
              '  <img src="https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=RiteshGenAI&theme=calm" height="220" />\n'
              '</p>\n'
              '<!-- GITHUB_DATA_END -->'
          )
          new_content = re.sub(pattern_cards, replacement_cards, new_content, flags=re.DOTALL)

          # Write back to README.md
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          "

      - name: Commit and Push Changes
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/RiteshGenAI/RiteshGenAI.git
          git add README.md
          git diff-index --quiet HEAD && exit 0
          git commit -m "docs: auto-update featured repositories [skip ci]"
          git pull --rebase origin main
          git push --force-with-lease origin main
